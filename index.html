<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emulador Nintendo 64 Web</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh; /* Evita que los botones táctiles se salgan de la pantalla */
            background: #000;
            overflow: hidden;
        }
        #emulator-container {
            width: 100vw;
            height: 100%;
            height: 100dvh;
        }
    </style>
</head>
<body>
    <div id="emulator-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'n64'; // Núcleo oficial para Nintendo 64
        EJS_gameUrl = 'sm.zip'; // <-- CAMBIA esto por el nombre exacto de tu archivo ZIP
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
